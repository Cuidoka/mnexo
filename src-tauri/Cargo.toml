[package]
name = "mnexo"
version = "0.1.0"
description = "MNEXO — fundação desktop local"
edition = "2021"

[lib]
name = "mnexo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"

